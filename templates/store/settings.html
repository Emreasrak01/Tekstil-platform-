{% extends 'base.html' %}

{% block title %}Mağaza Ayarları - AREM81{% endblock %}

{% block content %}
<main class="page-shell">
    <div class="page-heading">
        <div>
            <h1>Mağaza Ayarları</h1>
            <p>İletişim ve teslimat bilgilerinizi güncel tutun.</p>
        </div>
    </div>

    <div class="settings-layout">
        <aside class="surface-card">
            <nav>
                <a class="side-link active" href="{% url 'store_settings' %}"><i class="fa-solid fa-gear"></i> Profil</a>
                <a class="side-link" href="{% url 'store_cart' %}"><i class="fa-solid fa-bag-shopping"></i> Sepet</a>
                <a class="side-link" href="{% url 'store_favorites' %}"><i class="fa-solid fa-heart"></i> Favoriler</a>
                <a class="side-link" href="{% url 'store_orders' %}"><i class="fa-solid fa-receipt"></i> Siparişler</a>
            </nav>
        </aside>

        <section class="form-panel">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Kullanıcı adı</label>
                        <input class="form-control" value="{{ user.username }}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">E-posta</label>
                        <input class="form-control" type="email" name="email" value="{{ user.email }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Telefon</label>
                        <input class="form-control" name="phone" value="{{ user.phone }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mağaza adı</label>
                        <input class="form-control" name="store_name" value="{{ store_profile.store_name }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Şehir</label>
                        <input class="form-control" name="city" value="{{ store_profile.city }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Teslimat adresi</label>
                        <textarea class="form-control" name="address">{{ store_profile.address }}</textarea>
                    </div>
                </div>
                <div class="toolbar-actions">
                    <button class="btn btn-primary" type="submit"><i class="fa-solid fa-save"></i> Kaydet</button>
                </div>
            </form>
        </section>
    </div>
</main>
{% endblock %}
